<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scorpion-cursor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      cursor: none; 
    }

    body {
      background-color: #0d0d11;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
    }

    .info {
      text-align: center;
      pointer-events: none;
      user-select: none;
    }

    .info h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    .info p {
      color: #888;
    }

    #scorpion {
      position: fixed;
      top: 0;
      left: 0;
      width: 40px;
      height: 40px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: color 0.3s ease;
    }

    #scorpion svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 6px currentColor);
    }

    .trail {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      animation: fade-out 0.8s forwards ease-out;
      z-index: 9998;
    }

    @keyframes fade-out {
      0% {
        opacity: 0.8;
        transform: scale(1) translate(-50%, -50%);
      }
      100% {
        opacity: 0;
        transform: scale(0.1) translate(-50%, -50%);
      }
    }
  </style>
</head>
<body>

  <div class="info">
    <h1>Scorpion Cursor Effect</h1>
    <p>Gerakkan dan lepaskan mouse untuk melihat perubahan warna kursor kalajengking!</p>
  </div>

  <div id="scorpion">
    <svg viewBox="0 0 24 24" fill="currentColor">

      <path d="M12,2A2,2 0 0,0 10,4C10,4.74 10.4,5.39 11,5.73V7.17C9.53,7.57 8.35,8.64 7.66,10C7.22,9.66 6.63,9.5 6,9.64C5.15,9.84 4.54,10.56 4.5,11.43C4.45,12.42 5.25,13.22 6.24,13.17C7.11,13.13 7.83,12.5 8.03,11.67C8.5,11.95 9.04,12.15 9.63,12.24C8.92,13.13 8.5,14.26 8.5,15.5C8.5,16.5 8.78,17.44 9.27,18.24L7.4,19.32C6.94,18.81 6.27,18.5 5.5,18.5A2.5,2.5 0 0,0 3,21A0.5,0.5 0 0,0 3.5,21.5C4.88,21.5 6,20.38 6,19C6,18.73 5.95,18.47 5.87,18.23L7.91,17.05C8.75,18.22 10.04,19.06 11.5,19.38V21A1,1 0 0,0 12.5,22A1,1 0 0,0 13.5,21V19.38C14.96,19.06 16.25,18.22 17.09,17.05L19.13,18.23C19.05,18.47 19,18.73 19,19A2.5,2.5 0 0,0 21.5,21.5A0.5,0.5 0 0,0 22,21A2.5,2.5 0 0,0 19.5,18.5C18.73,18.5 18.06,18.81 17.6,19.32L15.73,18.24C16.22,17.44 16.5,16.5 16.5,15.5C16.5,14.26 16.08,13.13 15.37,12.24C15.96,12.15 16.5,11.95 16.97,11.67C17.17,12.5 17.89,13.13 18.76,13.17C19.75,13.22 20.55,12.42 20.5,11.43C20.46,10.56 19.85,9.84 19,9.64C18.37,9.5 17.78,9.66 17.34,10C16.65,8.64 15.47,7.57 14,7.17V5.73C14.6,5.39 15,4.74 15,4A2,2 0 0,0 13,2H12Z" />
    </svg>
  </div>

  <script>
    const scorpion = document.getElementById('scorpion');
    let isMoving = false;
    let currentColor = 'hsl(0, 100%, 50%)'; 
    let moveTimeout;

    function getRandomColor() {
      const hue = Math.floor(Math.random() * 360);
      return `hsl(${hue}, 100%, 60%)`;
    }

    window.addEventListener('mousemove', (e) => {
      const x = e.clientX;
      const y = e.clientY;

      scorpion.style.left = `${x}px`;
      scorpion.style.top = `${y}px`;

      if (!isMoving) {
        isMoving = true;
        currentColor = getRandomColor(); 
        scorpion.style.color = currentColor;
      }

      createTrailParticle(x, y, currentColor);

      clearTimeout(moveTimeout);
      moveTimeout = setTimeout(() => {
        isMoving = false; 
      }, 150); 
    });

    function createTrailParticle(x, y, color) {
      const particle = document.createElement('div');
      particle.className = 'trail';

      const size = Math.random() * 12 + 6;
      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;

      const offsetX = (Math.random() - 0.5) * 15;
      const offsetY = (Math.random() - 0.5) * 15;

      particle.style.left = `${x + offsetX}px`;
      particle.style.top = `${y + offsetY}px`;
      particle.style.backgroundColor = color;
      particle.style.boxShadow = `0 0 10px ${color}`;

      document.body.appendChild(particle);

      setTimeout(() => {
        particle.remove();
      }, 800);
    }
  </script>
</body>
</html>
